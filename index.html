<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F9F8F6">
<title>Speaker Ready</title>
<meta name="apple-mobile-web-app-title" content="Speaker Ready">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
/* Design repris de Cap Scrum : bento éditorial (crème, marine, terracotta) + structure iOS + dock Liquid Glass */
:root{
  --bg:#F9F8F6; --surface:#FFFFFF; --surface2:rgba(0,32,91,.05); --ink:#00205B; --muted:rgba(0,32,91,.6); --line:rgba(0,32,91,.08); --hair:rgba(0,32,91,.05);
  --accent:#E2725B; --accent-soft:rgba(226,114,91,.13); --link:#B94E39;
  --cta:#C2543E; --cta-ink:#FFFFFF;
  --navy-card:#00205B; --on-navy:#F9F8F6; --on-navy-muted:rgba(249,248,246,.65); --navy-track:rgba(249,248,246,.16);
  --icon-bg:rgba(0,32,91,.06);
  --good:#2F9E66; --good-ink:#1E7A4C; --good-bg:rgba(47,158,102,.12);
  --bad:#D1364A; --bad-ink:#B02236; --bad-bg:rgba(209,54,74,.10);
  --warn:#E2725B; --warn-ink:#B94E39; --warn-bg:rgba(226,114,91,.13);
  --shadow:0 8px 30px rgba(0,0,0,.03),0 1px 2px rgba(0,32,91,.03);
  --shadow-hi:0 14px 40px rgba(0,32,91,.12),0 2px 6px rgba(0,32,91,.06);
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(255,255,255,.9); --glass-low:rgba(0,32,91,.06); --glass-shadow:0 12px 34px rgba(0,32,91,.14),0 2px 6px rgba(0,32,91,.06);
  --amb1:rgba(226,114,91,.10); --amb2:rgba(0,32,91,.06);
  --f-display:"Montserrat","Avenir Next",-apple-system,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Roboto",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.42,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1430; --surface:#121E42; --surface2:rgba(244,241,236,.07); --ink:#F4F1EC; --muted:rgba(244,241,236,.62); --line:rgba(244,241,236,.10); --hair:rgba(244,241,236,.07);
  --accent:#EE8A73; --accent-soft:rgba(238,138,115,.16); --link:#F09A85;
  --cta:#EE8A73; --cta-ink:#0A1430;
  --navy-card:#1B2C5E; --on-navy:#F4F1EC; --on-navy-muted:rgba(244,241,236,.65); --navy-track:rgba(244,241,236,.14);
  --icon-bg:rgba(244,241,236,.08);
  --good:#4CC488; --good-ink:#6BD49D; --good-bg:rgba(76,196,136,.16);
  --bad:#F06478; --bad-ink:#F58495; --bad-bg:rgba(240,100,120,.16);
  --warn:#EE8A73; --warn-ink:#F09A85; --warn-bg:rgba(238,138,115,.16);
  --shadow:0 8px 30px rgba(0,0,0,.35); --shadow-hi:0 16px 44px rgba(0,0,0,.5);
  --glass:rgba(22,34,72,.5); --glass-edge:rgba(255,255,255,.18); --glass-low:rgba(255,255,255,.06); --glass-shadow:0 14px 36px rgba(0,0,0,.5);
  --amb1:rgba(238,138,115,.12); --amb2:rgba(80,110,200,.16);
  color-scheme:dark;}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:17px;line-height:1.42;letter-spacing:-.3px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 32% at 85% 8%,var(--amb1),transparent 70%),radial-gradient(45% 40% at 10% 90%,var(--amb2),transparent 70%),var(--bg)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(120px + env(safe-area-inset-bottom))}
body.inquiz .app{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header.top{padding:18px 4px 14px}
header.top span{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:40px;letter-spacing:-.8px;margin:4px 0 0}
h2{font-family:var(--f-body);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:28px 8px 10px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.tag{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.08px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.span2{grid-column:1 / -1}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left}
.tile .kpi{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tile .kpi small{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.tile.navy{background:var(--navy-card);color:var(--on-navy);border-color:transparent;box-shadow:var(--shadow-hi);position:relative;overflow:hidden}
.tile.navy::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(226,114,91,.35),transparent 70%);pointer-events:none}
.tile.navy .tag{color:var(--on-navy-muted)}
.hero-num{display:flex;align-items:baseline;gap:10px}
.hero-num b{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.95;letter-spacing:-2.5px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:16px;font-weight:600;color:var(--on-navy-muted)}
.tile.navy .meter{background:var(--navy-track)}
.tile.navy .meter i{background:var(--accent)}
.tile.navy p{color:var(--on-navy-muted);margin:0;font-size:15px}
.ico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--icon-bg);color:var(--ink)}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.cta{background:var(--cta);color:var(--cta-ink)}
.cont{flex-direction:row;align-items:center;gap:14px;cursor:pointer;font:inherit;color:inherit}
.cont .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cont .txt b{font-weight:600;font-size:16px;line-height:1.3}
.chev{flex:none;width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);opacity:.7;margin-right:4px}

.meter{position:relative;height:8px;border-radius:99px;background:var(--surface2)}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--on-navy-muted);margin-top:6px;font-variant-numeric:tabular-nums}
.prog{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* boutons */
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:14px 20px;border-radius:18px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font-weight:600;font-size:17px;text-align:center;box-shadow:var(--shadow)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--cta) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.btn[disabled]{opacity:.35;cursor:default}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{background:none;border:0;padding:8px 0;min-height:44px;color:var(--link);font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row3 .btn{padding:12px 8px;font-size:15px;min-height:52px}

/* pastilles / filtres */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:0;padding:4px 10px;border-radius:99px;background:var(--icon-bg);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.neutral{background:var(--surface2);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--hair);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);box-shadow:var(--shadow);min-height:40px;transition:transform .35s var(--spring),background-color .2s ease}
.chip.on{background:var(--navy-card);color:var(--on-navy);border-color:transparent}
.chip:active{transform:scale(.94)}

/* liste groupée */
.list{gap:0;background:var(--surface);border:1px solid var(--hair);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.les{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;padding:14px 18px;min-height:60px;position:relative}
.les + .les::before{content:"";position:absolute;top:0;left:74px;right:0;height:1px;background:var(--hair)}
.les b{font-weight:600;display:block}
.les .fr{font-size:15px;color:var(--muted);letter-spacing:-.2px;display:block;margin-top:2px}
.les .ico{width:40px;height:40px;border-radius:12px}
.les .ico svg{width:20px;height:20px}
.les .n{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.les.nav::after{content:"";width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);opacity:.6}

/* carte mémoire */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:28px 22px;cursor:pointer;border-radius:28px;width:100%;font:inherit}
.flash .term{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:38px;letter-spacing:-.8px;text-wrap:balance}
.flash .hint{font-size:14px;color:var(--muted);font-weight:600}
.flash.navy{background:var(--navy-card);color:var(--on-navy);border:0;box-shadow:var(--shadow-hi);position:relative;overflow:hidden}
.flash.navy::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(226,114,91,.35),transparent 70%);pointer-events:none}
.flash.navy .term{font-size:24px;line-height:30px}
.flash.navy .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.flash.navy .ex{font-size:16px;color:var(--on-navy-muted);font-style:italic;margin-top:6px}
.flash.navy .en{font-size:14px;font-weight:600;color:var(--on-navy-muted)}
.counter{text-align:center;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0;font-variant-numeric:tabular-nums}

/* quiz */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.segs{display:flex;gap:3px;margin:2px 0 16px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.segs i.ok{background:var(--good)} .segs i.ko{background:var(--bad)} .segs i.cur{background:var(--accent)}
.qtext{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:29px;letter-spacing:-.5px;margin:14px 0 6px;text-wrap:balance}
.qhint{font-size:15px;color:var(--muted);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:center;text-align:left;min-height:58px;padding:14px 16px;border-radius:20px;border:1.5px solid var(--hair);background:var(--surface);box-shadow:var(--shadow)}
.opt .l{font-family:var(--f-display);font-size:14px;font-weight:800;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--icon-bg);color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .l{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)} .opt.ko .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:22px;padding:18px 20px;background:var(--surface);border:1px solid var(--hair)}
.feedback.good{background:var(--good-bg);border-color:transparent} .feedback.bad{background:var(--bad-bg);border-color:transparent}
.feedback b.v{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;margin-bottom:4px}
.feedback p{margin:0;font-size:15px}
.actions{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.score .big{display:flex;align-items:baseline;gap:8px}
.score .big b{font-family:var(--f-display);font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.score .big small{font-size:16px;font-weight:600;color:var(--muted)}

/* modes */
.mod{display:grid;grid-template-columns:48px 1fr 12px;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.mod::after{content:"";width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);opacity:.6}
.mod .num{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;background:var(--icon-bg);color:var(--ink)}
.mod b{font-weight:600;display:block}
.mod .sub{font-size:15px;color:var(--muted);letter-spacing:-.2px}

/* oral */
.speak .phrase{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:32px;letter-spacing:-.6px;margin:12px 0 6px;text-wrap:balance}
.heard{font-size:18px;font-weight:600;line-height:1.5}
.heard .hit{color:var(--good-ink)} .heard .miss{color:var(--bad-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.note{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:16px;padding:12px 14px;margin-bottom:14px}
.rec-on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--cta) 18%,transparent)}}

/* dock Liquid Glass */
nav.tabs{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);width:calc(100% - 32px);max-width:440px;padding:6px;border-radius:34px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.04);backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 var(--glass-low),inset 0 0 0 1px var(--glass-low),var(--glass-shadow);overflow:hidden;
  transition:opacity .3s ease,transform .45s var(--spring)}
nav.tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 45%),radial-gradient(120% 60% at 50% -20%,rgba(255,255,255,.25),transparent 60%);mix-blend-mode:soft-light}
body.inquiz nav.tabs{opacity:0;pointer-events:none;transform:translate(-50%,30px) scale(.94)}
nav.tabs .in{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.ind{position:absolute;top:0;bottom:0;left:0;width:20%;pointer-events:none;transition:transform .55s var(--spring)}
.ind::before{content:"";position:absolute;inset:0 3px;border-radius:28px;background:var(--accent-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 2px 8px rgba(0,32,91,.08)}
.tab{position:relative;z-index:1;background:none;border:0;border-radius:28px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--muted);transition:color .3s ease;padding:0}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--spring)}
.tab[aria-current="page"]{color:var(--link)}
.tab[aria-current="page"] svg{stroke-width:2.2;transform:translateY(-1px) scale(1.08)}
.tab:active svg{transform:scale(.88)}

/* pressions */
.btn,.opt,.mod,.les,.tile,.back,.flash{transition:transform .35s var(--spring),box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.btn:active:not([disabled]),.mod:active,.opt:active:not([disabled]),.cont:active,.flash:active{transform:scale(.97)}
.les:active{background:var(--surface2)}

@media (prefers-reduced-motion: no-preference){
  .v-fade{animation:vFade .32s var(--ease) both} .v-up{animation:vUp .5s var(--ease) both}
  @keyframes vFade{from{opacity:0;transform:translateY(8px) scale(.99)}}
  @keyframes vUp{from{opacity:0;transform:translateY(40px) scale(.97)}}
  .v-fade .stack > *,.v-fade .bento > *,.v-up .opt{animation:stag .55s var(--ease) both}
  .v-fade .bento > *:nth-child(2),.v-fade .stack > *:nth-child(2),.v-up .opt:nth-child(2){animation-delay:.05s}
  .v-fade .bento > *:nth-child(3),.v-fade .stack > *:nth-child(3),.v-up .opt:nth-child(3){animation-delay:.1s}
  .v-fade .bento > *:nth-child(4),.v-fade .stack > *:nth-child(4),.v-up .opt:nth-child(4){animation-delay:.15s}
  .v-fade .stack > *:nth-child(5){animation-delay:.2s}
  @keyframes stag{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .meter i,.prog i{transform-origin:left;animation:grow .9s var(--ease) both .15s}
  @keyframes grow{from{transform:scaleX(0)}}
  .feedback{animation:pop .45s var(--spring) both}
  .opt.ok{animation:okp .45s var(--spring)} .opt.ko{animation:shake .4s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
  @keyframes okp{50%{transform:scale(1.025)}}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  .flip{animation:flip .45s var(--spring) both}
  @keyframes flip{from{opacity:.4;transform:perspective(800px) rotateY(-70deg)}}
}

/* ---------- Leçons ---------- */
.les .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;font-family:var(--f-display);background:var(--icon-bg);color:var(--ink)}
.les.done .dot{background:var(--good-bg);color:var(--good-ink)}
.les.cur .dot{background:var(--cta);color:var(--cta-ink)}
.les.small{grid-template-columns:34px 1fr auto}
.les.small.nav{grid-template-columns:34px 1fr auto 10px}
.les.small + .les.small::before{left:64px}
.reader .kick{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.reader h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:35px;letter-spacing:-.8px;margin:6px 0 4px;text-wrap:balance}
.box{border-radius:22px;padding:18px 20px;margin:12px 0}
.box .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:block}
.box.ex{background:var(--navy-card);color:var(--on-navy);position:relative;overflow:hidden}
.box.ex::after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(226,114,91,.3),transparent 70%);pointer-events:none}
.box.ex .lab{color:var(--accent)}
.box.ex p{margin:0;color:var(--on-navy);font-size:16px;line-height:1.5}
.box.key{background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow)}
.box.key .lab{color:var(--good-ink)}
.box.key h3{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.4px;margin:0 0 8px}
.box.key p{margin:0 0 12px;font-size:16px;line-height:1.5}
.gex{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--hair);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.gex .ico{width:34px;height:34px;border-radius:10px}
.gex .ico svg{width:18px;height:18px}
.gex b{display:block;font-weight:600;font-size:16px}
.gex span.fr{display:block;font-size:14px;color:var(--muted)}
.readnav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.readnav .btn{font-size:15px;min-height:50px}
.les .ex{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:3px}

/* ---------- Jeux ---------- */
.gamebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gstat{display:flex;gap:8px}
.gstat .pill{font-size:13px;padding:6px 12px}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mc{min-height:92px;border-radius:18px;border:1.5px solid var(--hair);background:var(--navy-card);color:var(--on-navy);font-size:14px;font-weight:600;line-height:1.25;padding:10px 8px;display:grid;place-items:center;text-align:center;box-shadow:var(--shadow);transition:transform .35s var(--spring),background-color .25s ease}
.mc .q{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--accent)}
.mc.up{background:var(--surface);color:var(--ink)}
.mc.up.fr{color:var(--link)}
.mc.ok{background:var(--good-bg);color:var(--good-ink);border-color:transparent}
.mc.no{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
.mc:active{transform:scale(.95)}
.chrono-card{text-align:center;padding:30px 20px;margin-top:14px}
.chrono-card .w1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:34px;letter-spacing:-.6px}
.chrono-card .eq{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0;text-transform:uppercase;letter-spacing:.4px}
.chrono-card .w2{font-size:20px;font-weight:600;color:var(--link)}
.timer{font-size:15px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--hair);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad-ink);background:var(--bad-bg)}
.flashfx{animation:none}
.flash-ok{box-shadow:0 0 0 3px var(--good)!important}
.flash-ko{box-shadow:0 0 0 3px var(--bad)!important}
.build{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:14px;border-radius:20px;border:1.5px dashed var(--line);background:var(--surface2);margin:14px 0}
.build:empty::before{content:"Touche les mots dans l’ordre";color:var(--muted);font-size:15px;align-self:center}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:16px;font-weight:600;box-shadow:var(--shadow);transition:transform .3s var(--spring)}
.tok.in{background:var(--navy-card);color:var(--on-navy);border-color:transparent}
.tok:active{transform:scale(.92)}
.field{width:100%;min-height:56px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:20px;font-weight:600;padding:0 18px;text-align:center}
.field:focus{outline:2px solid var(--accent);outline-offset:1px}
.bigplay{width:96px;height:96px;border-radius:50%;margin:10px auto 6px;display:grid;place-items:center;background:var(--cta);color:var(--cta-ink);border:0;box-shadow:0 10px 28px color-mix(in srgb,var(--cta) 35%,transparent)}
.bigplay svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.center{text-align:center}

/* ---------- Congress Loop ---------- */
.loopcard{width:100%;font:inherit;cursor:pointer;gap:8px}
.loopcard .lt{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.8px;line-height:1.05}
.loopcard .ld{color:var(--on-navy-muted);font-size:15px}
.loopcard .btn{margin-top:6px;position:relative;z-index:1}
.lstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px;position:relative;z-index:1}
.lstats > *{display:flex;flex-direction:column}
.lstats b{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.lstats span span,.lstats div span{font-size:12px;font-weight:600;color:var(--on-navy-muted)}
.mutebtn{border:1px solid var(--hair);background:var(--surface);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow)}
.mutebtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lvpath{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin:18px 0 10px;position:relative}
.node{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.node .nd{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--surface);color:var(--ink);border:1px solid var(--hair);box-shadow:var(--shadow);position:relative;transition:transform .35s var(--spring)}
.node .nd svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.node .nd em{position:absolute;top:-4px;right:-6px;font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:99px;padding:2px 6px}
.node.won .nd{background:var(--navy-card);color:var(--on-navy);border-color:transparent}
.node.cur .nd{background:var(--cta);color:var(--cta-ink);border-color:transparent;animation:nodep 1.6s ease-in-out infinite}
.node.locked{opacity:.45;cursor:default}
.node:active:not([disabled]) .nd{transform:scale(.92)}
@keyframes nodep{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--cta) 20%,transparent)}}
.st{color:var(--line);font-size:14px;letter-spacing:1px}
.st.on{color:#F2B33D}
.st.big{font-size:44px;display:inline-block}
.tile.navy .st{color:var(--navy-track)} .tile.navy .st.on{color:#F2B33D}
@media (prefers-reduced-motion: no-preference){.st.big.on{animation:starpop .55s var(--spring) both}}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.lwin .stars{text-align:center;margin:4px 0}
.shoprow{grid-template-columns:44px 1fr auto}
.buy{border:0;cursor:pointer;font-size:13px;padding:7px 12px}
.buy[disabled]{cursor:default}

.lp{position:relative;user-select:none;-webkit-user-select:none}
.lp-top{display:flex;align-items:center;gap:10px}
.lp-top .back{font-size:26px;padding:4px 6px 4px 0}
.lp-lv{flex:1;display:flex;flex-direction:column;line-height:1.2}
.lp-lv span{font-size:13px;font-weight:600;color:var(--muted)}
.lp-lv b{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.tbar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 8px}
.tbar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:background-color .3s}
.tbar.low i{background:var(--bad)}
.lp-prog{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.pots{display:grid;gap:8px}
.pots.p2{grid-template-columns:1fr 1fr}.pots.p3{grid-template-columns:repeat(3,1fr)}.pots.p4{grid-template-columns:repeat(2,1fr)}
.pot{border:1px solid var(--hair);background:var(--surface);border-radius:20px;padding:10px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);min-height:118px;font:inherit;color:inherit;transition:transform .35s var(--spring),background-color .25s}
.pots.p4 .pot{min-height:100px;flex-direction:row;gap:8px;padding:8px 10px}
.pots.p4 .pot .plbl{text-align:left;flex:1}
.pots.p4 .potsvg{width:46px}
.plbl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:700;line-height:1.2;min-height:46px}
.plbl b{font-family:var(--f-display);font-size:15px}
.plbl span{font-size:12px;color:var(--good-ink);font-weight:600}
.pot.done{background:var(--good-bg);border-color:transparent;transform:scale(1.04)}
.pot.empty{opacity:.35;box-shadow:none;border-style:dashed}
.pot.audio .aud{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--link)}
.pot.audio .aud svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.potsvg{width:58px;height:auto;flex:none}
.potsvg .body{fill:var(--navy-card)} .potsvg .rim{fill:var(--accent)} .potsvg .rim-s{stroke:var(--navy-card);stroke-width:4;stroke-linecap:round}
.potsvg .steam{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.5}
.pot.done .potsvg .body{fill:var(--good)}
@media (prefers-reduced-motion: no-preference){.potsvg .steam{animation:steam 2.4s ease-in-out infinite}}
@keyframes steam{50%{transform:translateY(-3px);opacity:.15}}
.belt{position:relative;height:124px;margin:12px 0 10px;border-radius:24px;background:var(--navy-card);overflow:hidden;box-shadow:var(--shadow-hi)}
.lane{position:absolute;left:0;right:0;height:58px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 24px)}
.lane.l0{top:0}.lane.l1{bottom:0}
.belt::after{content:"";position:absolute;left:12px;right:12px;top:61px;height:2px;border-radius:2px;background:rgba(255,255,255,.12)}
.chips-layer{position:absolute;inset:0}
.wchip{position:absolute;left:0;top:0;width:112px;height:50px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;line-height:1.15;padding:4px 8px;display:grid;place-items:center;text-align:center;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.25);will-change:transform;touch-action:manipulation}
.wchip.rev{font-size:12.5px;font-weight:600}
.wchip:active{filter:brightness(.92)}
.hint{box-shadow:0 0 0 3px var(--accent),0 0 18px var(--accent)!important}
.lp.frozen .belt{background:#1D4E7A}
.lp.frozen .tbar i{background:#5AA9E6}
.tray-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin:4px 4px 6px}
.tray{display:flex;gap:6px}
.slot{flex:1;min-width:0;height:54px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface2);font:inherit;font-size:12.5px;font-weight:700;line-height:1.1;padding:3px;display:grid;place-items:center;text-align:center;overflow:hidden;color:var(--ink)}
.slot.full{border:0;background:var(--surface);box-shadow:var(--shadow);border-bottom:3px solid var(--accent)}
.slot.full.intrus{border-bottom-color:var(--bad);color:var(--bad-ink)}
.slot.shake{animation:shake .4s ease}
.boosts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.bst{position:relative;border:1px solid var(--hair);background:var(--surface);border-radius:16px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.bst svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bst i{position:absolute;top:-6px;right:-4px;font-style:normal;font-size:11px;font-weight:800;background:var(--cta);color:var(--cta-ink);border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.bst:active{transform:scale(.95)}
.lfloat{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--good-ink);pointer-events:none;white-space:nowrap;animation:floatUp .95s var(--ease) forwards;z-index:3;text-shadow:0 2px 8px var(--bg)}
.lfloat.t{top:auto;bottom:80px;color:var(--warn-ink);font-size:16px}
@keyframes floatUp{from{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}to{opacity:0;transform:translate(-50%,-40px) scale(1)}}

.loopstage{position:fixed;inset:0;z-index:60;background:#FFF3E2;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#lpwrap{position:absolute;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:50%;width:min(100%,480px);transform:translateX(-50%)}
#lpwrap canvas{display:block}

.ibcard{background:linear-gradient(140deg,#5B5FC7 0%,#3E41A8 55%,#128C7E 100%)!important;margin-top:14px}
.ibcard::after{background:radial-gradient(circle,rgba(37,211,102,.45),transparent 70%)!important}
.ibtile{background:linear-gradient(140deg,#5B5FC7 0%,#3E41A8 55%,#128C7E 100%)!important}
.ibwin{background:linear-gradient(140deg,#5B5FC7 0%,#3E41A8 100%)!important;margin-top:8px}
.ibico{font-size:22px}
.ibpath{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0 10px}
.ibpath .nd{width:58px;height:58px;font-size:14px}
.ibpath .node.won .nd{background:#5B5FC7}
.ibpath .st{font-size:11px}

.sesstile{background:linear-gradient(120deg,var(--cta),#E2725B 60%,#F2A33A)!important;color:#fff;border:0!important;box-shadow:0 12px 30px rgba(194,84,62,.35)!important}
.sesstile .tag{color:rgba(255,255,255,.85)!important}.sesstile .chev{border-color:#fff}
.sesstile .ico.cta{background:#fff;color:var(--cta);font-weight:800}
.sesstile.done{background:var(--surface)!important;color:var(--ink);box-shadow:var(--shadow)!important;border:1px solid var(--hair)!important}
.sesstile.done .tag{color:var(--good-ink)!important}.sesstile.done .chev{border-color:var(--muted)}.sesstile.done .ico.cta{background:var(--good-bg);color:var(--good-ink)}
.sesslab{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin:-8px 2px 4px}
.sesslab span.on{color:var(--link)}
.flash.learn{cursor:default;gap:12px}
.flash.learn .fr2{font-size:20px;font-weight:700;color:var(--link)}
.flash.learn .ex2{font-size:16px;color:var(--muted);font-style:italic}
.codebox{width:100%;min-height:96px;margin:12px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;word-break:break-all;resize:vertical}
</style>
